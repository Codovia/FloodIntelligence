[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodpulse"
version = "0.1.0"
description = "Karnataka flood decision-support and emergency-response platform"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
floodpulse-check-data = "floodpulse.data_contracts:main"
floodpulse-build-labels = "floodpulse.labels:main"
floodpulse-build-rainfall-features = "floodpulse.rainfall:main"

[tool.setuptools.packages.find]
where = ["src"]
